input {
  beats {
    port => 5044
  }
  udp {
    port  => 5000
    codec => json
    type  => "suricata"
  }
}

filter {
  # espace réservé pour la Phase 3 : parsing, GeoIP, mapping MITRE
}

output {
  if [type] == "suricata" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "suricata-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "filebeat-%{+YYYY.MM.dd}"
    }
  }
  stdout { codec => rubydebug }   # à retirer une fois le pipeline validé
}