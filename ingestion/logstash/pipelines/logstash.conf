input {
  beats {
    port => 5044
  }
  tcp {
    port  => 5000
    codec => json_lines
    type  => "suricata"
  }
}

filter {
  # On garde cet espace pour la future Phase 3 (Enrichissement GeoIP, MITRE ATT&CK...)
}

output {
  if [type] == "suricata" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "suricata-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "filebeat-%{+YYYY.MM.dd}"
    }
  }
  stdout { codec => rubydebug }   # à retirer une fois le pipeline validé
}