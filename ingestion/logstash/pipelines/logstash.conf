input {
  beats {
    port => 5044
  }
  tcp {
    port => 5000
    codec => json_lines
    type => "suricata"
  }
}

filter {
  if [type] == "suricata" and [event_type] == "alert" {

    # 1) Priorité : SID connu (nos règles custom)
    mutate {
      convert => { "[alert][signature_id]" => "string" }
    }

    translate {
      source           => "[alert][signature_id]"
      target           => "[mitre][raw]"
      dictionary_path  => "/usr/share/logstash/dictionaries/mitre-by-sid.yml"
      exact            => true
      refresh_interval => 300
    }

    # 2) Repli : Pattern sur le libellé (règles ET Open)
    if ![mitre][raw] {
      translate {
        source           => "[alert][signature]"
        target           => "[mitre][raw]"
        dictionary_path  => "/usr/share/logstash/dictionaries/mitre-by-pattern.yml"
        regex            => true
        fallback         => "Unmapped|-|Not yet mapped to MITRE ATT&CK"
        refresh_interval => 300
      }
    }

    # 3) Eclatement de la chaine brute en vrais sous-champs Elastic
    mutate {
      split      => { "[mitre][raw]" => "|" }
      add_field  => {
        "[mitre][tactic]"         => "%{[mitre][raw][0]}"
        "[mitre][technique_id]"   => "%{[mitre][raw][1]}"
        "[mitre][technique_name]" => "%{[mitre][raw][2]}"
      }
      remove_field => ["[mitre][raw]"]
    }
  }
}

output {
  if [type] == "suricata" {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "suricata-%{+YYYY.MM.dd}"
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "filebeat-%{+YYYY.MM.dd}"
    }
  }
  stdout { codec => rubydebug }
}