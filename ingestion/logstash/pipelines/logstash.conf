input {
  udp {
    port => 5000
    codec => plain
  }

  beats {
    port => 5044
  }
}

filter {

  # logs système linux (Filebeat)
  if [fileset][module] == "system" {
    mutate { add_tag => ["system-log"] }
  }

  # logs Suricata venant de pfSense
  if [host] == "192.168.30.1" {
    grok {
      match => {
        "message" => "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:host} %{DATA:program}: %{GREEDYDATA:suricata_message}"
      }
    }
    mutate { add_tag => ["suricata"] }
  }

}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
  }

  stdout { codec => rubydebug }
}